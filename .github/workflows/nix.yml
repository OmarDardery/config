name: Evaluate Nix configuration
on:
  pull_request:
    paths: ['nixos/**', 'non-nixos/**', 'scripts/**', 'tests/**', '*.sh', 'flake.*', '.github/**']
  push:
    branches: [main]
    paths: ['nixos/**', 'non-nixos/**', 'scripts/**', 'tests/**', '*.sh', 'flake.*', '.github/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise NixOS and standalone Home Manager bootstraps
        run: |
          python3 tests/bootstrap.py
          python3 tests/deploy.py
          python3 tests/dotfiles.py
          python3 tests/native_install.py
          python3 tests/login_shell.py
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://noctalia.cachix.org
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Verify installed bootloader and state-version preservation
        run: python3 tests/installed.py
      - name: Evaluate with temporary hardware
        shell: bash
        run: |
          bash tests/check-nixos.sh

  native:
    name: Standalone Linux (${{ matrix.system }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Check standalone desktop and installers
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: bash tests/check-native.sh "$TARGET_SYSTEM"
