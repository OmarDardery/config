font_family JetBrainsMono Nerd Font
font_size 14
background_opacity 0.94
dynamic_background_opacity yes
cursor_trail 1
enable_audio_bell no
update_check_interval 0
confirm_os_window_close -1
scrollback_lines 20000
window_padding_width 10
enabled_layouts splits,stack,tall
tab_bar_style powerline
tab_bar_min_tabs 2
map ctrl+shift+enter launch --cwd=current
map ctrl+shift+d combine : goto_layout splits : launch --location=hsplit --cwd=current
map ctrl+shift+alt+d combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+j next_window
map ctrl+shift+k previous_window
map ctrl+shift+z toggle_layout stack
# Optional palette written by Noctalia's native Kitty template.
globinclude noctalia*.conf
