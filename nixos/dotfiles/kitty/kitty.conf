font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
cursor_trail 1
background_opacity 0.6

font_size 14.0

initial_window_width 95c
initial_window_height 35c

enable_audio_bell no

# window
window_padding_width 5
window_margin_width 5
window_border_width 2px
enabled_layouts Tall, *
shell_integration enabled
confirm_os_window_close -1

map kitty_mod+j third_window
map kitty_mod+l second_window
map kitty_mod+h first_window
map ctrl+shift+[ next_window

# Noctalia owns the palette; Kitty's native defaults apply before first rendering.
# Outside ~/.config/kitty because this tree is a read-only store symlink and
# noctalia has to write it; kitty just logs "ignoring" if it is not there yet,
# See dotfiles/noctalia/config.toml.
include ~/.local/state/noctalia/theme/kitty.conf
