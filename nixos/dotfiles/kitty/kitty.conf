# Relative to this file, like the themes include below. The absolute
# ~/.config path this used to use pointed back through the store symlink
# at this same file, and broke if the config lived anywhere else.
include colors-kitty.conf

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
cursor_trail 1
background_opacity 0.6

font_size 14.0

initial_window_width 95c
initial_window_height 35c

enable_image_protocol yes
enable_audio_bell no

# window
window_padding_width 5
window_margin_width 5
window_border_width 2px
active_border_color #e0e4e5
inactive_border_color #9EA3A7
enabled_layouts Tall, *
shell_integration enabled
confirm_os_window_close -1

map kitty_mod+j third_window
map kitty_mod+l second_window
map kitty_mod+h first_window
map ctrl+shift+[ next_window
include themes/noctalia.conf
