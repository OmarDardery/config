# Noctalia configuration, deployed by home/noctalia.nix.
#
# Generated once with `noctalia config export merged`, which is the official
# way to turn a GUI-tuned setup into a file, then edited by hand from here on.
#
# ── Read this before wondering why an edit did nothing ───────────────────
# Noctalia loads, in order: built-in defaults, then every *.toml in
# ~/.config/noctalia (this file), then ~/.local/state/noctalia/settings.toml.
# The state file loads LAST and wins per key. It is where the Settings GUI
# writes, and it is deliberately outside ~/.config so the GUI still works when
# the config directory is read-only, which on NixOS it always is.
#
# So: anything you change in the GUI lands in the state file and overrides this
# file for that key. To fold GUI changes back in, re-run
# `noctalia config export merged` and update this file.
#
# After editing: `noctalia msg config-reload` (no restart, no rebuild needed
# beyond `up` to redeploy the symlink).

[backdrop]
blur_intensity = 0.5599999874830246
tint_intensity = 0.34999999217689037

[bar.default]
background_opacity = 0.21999999508261681
capsule = true
capsule_border = "on_primary"
capsule_foreground = "primary"
capsule_opacity = 0.3899999912828207
capsule_thickness = 0.60999999009072781
end = [ "media", "tray", "notifications", "clipboard", "group:g1", "power_profile", "battery", "control-center", "session" ]
reserve_space = false
smart_auto_hide = true
start = [ "launcher", "wallpaper", "workspaces", "nix-monitor", "status", "widget" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 0.38999998569488525
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 144.0
    box_width = 240.0
    cx = 205.5
    cy = 181.5
    output = "eDP-1"
    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background_opacity = 0.0
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1499.5
    cy = 869.5
    output = "eDP-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false

[dock]
enabled = true
icon_size = 31
launcher_icon = "gpu-usage"
reserve_space = false
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@eDP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 229.0
    box_width = 810.0
    cx = 854.0
    cy = 868.5
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 229.0
    box_width = 810.0
    cx = 854.0
    cy = 868.5
    output = "eDP-2"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-26.05"

[plugins]
enabled = [ "alexander/screen-toolkit", "avivbintangaringga/nix-monitor", "davemhammer/tailscale" ]

[shell.animation]
speed = 2.0000000298023224

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "yazi" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    interval_seconds = 5

    [wallpaper.default]
    path = "/home/oad/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

    [wallpaper.last]
    path = "/home/oad/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/oad/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/oad/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

[widget.control-center]
glyph = "settings"

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.status]
show_counts = false
type = "davemhammer/tailscale:status"

[widget.widget]
type = "alexander/screen-toolkit:widget"
