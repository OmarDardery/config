[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-26.05"
system_stats_check_mode = "off"

[plugins]
enabled = [ "alexander/screen-toolkit", "avivbintangaringga/nix-monitor", "icefish/phone-connect", "thepunkoff/pomodoro", "alexander/game-launcher" ]
source = []
auto_update = "none"

[shell]
polkit_agent = true

# The secure lock screen omits lock actions, but exposes the other power choices.
[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
variant = "destructive"
shortcut = "5"

[[shell.session.actions]]
action = "suspend"
shortcut = "6"
# Visible on the lock screen, but still lock first when used from the desktop menu.
command = "noctalia msg session lock-and-suspend"

[shell.animation]
speed = 2.0000000298023224

[shell.panel]
launcher_placement = "attached"
open_near_click_launcher = true
open_near_click_wallpaper = true
transparency_mode = "glass"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    # Noctalia owns color generation, not immutable application configuration.
    # Application templates and hooks use pinned sources in home/noctalia.nix.
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "starship", "kitty" ]
    community_ids = []

    # User templates: same rendering, writable destination. Both paths below
    # expand at runtime — the engine handles the $XDG_* tokens and a leading ~,
    # so nothing here hardcodes a home directory.
    #
    # ~/.local/state is the right side of the line: it is generated output that
    # changes with the wallpaper, not configuration, so it does not belong in
    # git and does not fight home-manager for ownership of a path.

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    interval_seconds = 300

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

    [wallpaper.last]
    path = "~/Pictures/Wallpapers/wp9432445-4k-mountains-desktop-wallpapers.jpg"

[widget.control-center]
glyph = "settings"

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.widget]
type = "alexander/screen-toolkit:widget"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.widget_2]
type = "thepunkoff/pomodoro:widget"
