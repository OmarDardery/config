# Noctalia configuration, deployed by home/noctalia.nix.
#
# Generated once with `noctalia config export merged`, which is the official
# way to turn a GUI-tuned setup into a file, then edited by hand from here on.
#
# ── Read this before wondering why an edit did nothing ───────────────────
# Noctalia loads, in order: built-in defaults, then every *.toml in
# ~/.config/noctalia (this file), then ~/.local/state/noctalia/settings.toml.
# The state file loads LAST and wins per key. It is where the Settings GUI
# writes, and it is deliberately outside ~/.config so the GUI still works when
# the config directory is read-only, which on NixOS it always is.
#
# So: anything you change in the GUI lands in the state file and overrides this
# file for that key. To fold GUI changes back in, re-run
# `noctalia config export merged` and update this file.
#
# After editing: `noctalia msg config-reload` (no restart, no rebuild needed
# beyond `up` to redeploy the symlink).

[backdrop]
blur_intensity = 0.5599999874830246
tint_intensity = 0.34999999217689037

[idle]
behavior_order = [ "lock", "screen-off" ]

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 660
action = "screen_off"

[bar.default]
background_opacity = 0.59999998658895493
border = "on_primary"
capsule = true
capsule_border = "on_primary"
capsule_foreground = "primary"
capsule_opacity = 0.3899999912828207
capsule_thickness = 0.60999999009072781
center = []
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "group:g1", "session" ]
margin_edge = 5
margin_ends = 400
padding = 6
position = "bottom"
radius = 13
shadow = false
thickness = 29
reserve_space = false
smart_auto_hide = true
start = [ "clock", "launcher", "wallpaper", "workspaces", "nix-monitor", "bar", "launcher_2", "widget_2" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "on_primary"
    enabled = true
    fill = "surface_variant"
    foreground = "primary"
    id = "g1"
    members = [ "network", "bluetooth", "power_profile", "battery", "control-center" ]
    opacity = 0.38999998569488525
    padding = 6.0

[control_center]
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "wifi"
    [[control_center.shortcuts]]
    type = "bluetooth"
    [[control_center.shortcuts]]
    type = "nightlight"
    [[control_center.shortcuts]]
    type = "notification"
    [[control_center.shortcuts]]
    type = "alexander/screen-toolkit:toggle"
    [[control_center.shortcuts]]
    type = "caffeine"

