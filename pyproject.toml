[project]
name = "config-helpers"
version = "0.1.0"
description = "Development dependencies for the desktop configuration helpers"
requires-python = ">=3.12,<3.13"
dependencies = ["tomlkit>=0.13,<1"]

[dependency-groups]
dev = ["debugpy>=1.8,<2", "pytest>=8,<10"]

[tool.uv]
package = false
python-downloads = "never"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["nixos/pkgs", "nixos/native"]
addopts = "-ra"

[tool.basedpyright]
include = ["nixos/pkgs", "nixos/native", "tests"]
extraPaths = ["nixos/pkgs", "nixos/native"]
exclude = [".venv", ".direnv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
