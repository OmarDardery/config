# Kitty Colorscheme - High Contrast Slate Complement
# Designed to stand out against a blurred/transparent background of slate grays
# (Palette: #151618, #272A2D, #394147, #565D62, #768187, #A1A2A7, #BEBDC2, #E1E0E1)

# The basic colors
foreground              #E1E0E1
background              #151618
selection_foreground    #151618
selection_background    #BEBDC2

# Cursor colors (high visibility yellow/amber)
cursor                  #FFD600
cursor_text_color       #151618

# URL underline color when hovering with mouse
